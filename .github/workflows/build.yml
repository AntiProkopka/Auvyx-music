name: Build auvyx APK
run-name: auvyx Alpha 2.0 APK · ${{ github.event_name }}

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auvyx-alpha-2-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Restore stable signing key (optional but recommended)
        env:
          AUVYX_SIGNING_KEYSTORE_BASE64: ${{ secrets.AUVYX_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AUVYX_SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$AUVYX_SIGNING_KEYSTORE_BASE64" | base64 --decode > app/auvyx-signing.jks
          else
            echo "No stable signing keystore supplied; using the runner debug key."
          fi

      - name: Build debug APK
        env:
          AUVYX_SIGNING_STORE_PASSWORD: ${{ secrets.AUVYX_SIGNING_STORE_PASSWORD }}
          AUVYX_SIGNING_KEY_ALIAS: ${{ secrets.AUVYX_SIGNING_KEY_ALIAS }}
          AUVYX_SIGNING_KEY_PASSWORD: ${{ secrets.AUVYX_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify launcher resources in APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^package: name='com\.nexus\.music' versionCode='[0-9]+' versionName='Alpha 2\.0'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
          "$aapt2" dump resources "$apk" > "$RUNNER_TEMP/auvyx-resources.txt"
          for resource in drawable/auvyx_default_icon drawable/auvyx_neon_icon drawable/auvyx_glass_icon mipmap/ic_launcher mipmap/ic_launcher_round mipmap/auvyx_icon_1 mipmap/auvyx_icon_2 mipmap/auvyx_icon_3; do
            grep -F " $resource" "$RUNNER_TEMP/auvyx-resources.txt"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: auvyx-Alpha-2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report signing mode
        if: always()
        run: |
          if [ -f app/auvyx-signing.jks ]; then
            echo "Stable signing keystore was supplied to this build."
          else
            echo "WARNING: stable signing keystore is missing; this APK uses the runner's debug key."
          fi
