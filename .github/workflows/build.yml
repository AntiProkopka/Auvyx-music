name: Build auvyx APK
run-name: auvyx Alpha 2.1 APK · ${{ github.event_name }}

on:
  push:
    branches: [ main, master, alpha-2.0-bugfix-cloud, alpha-2.1-glass-ui ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_apk:
        description: Publish a downloadable APK in GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: auvyx-alpha-2-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore stable signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          AUVYX_SIGNING_KEYSTORE_BASE64: ${{ secrets.AUVYX_SIGNING_KEYSTORE_BASE64 }}
          AUVYX_SIGNING_STORE_PASSWORD: ${{ secrets.AUVYX_SIGNING_STORE_PASSWORD }}
          AUVYX_SIGNING_KEY_ALIAS: ${{ secrets.AUVYX_SIGNING_KEY_ALIAS }}
          AUVYX_SIGNING_KEY_PASSWORD: ${{ secrets.AUVYX_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$AUVYX_SIGNING_KEYSTORE_BASE64$AUVYX_SIGNING_STORE_PASSWORD$AUVYX_SIGNING_KEY_ALIAS$AUVYX_SIGNING_KEY_PASSWORD" ]; then
            if [ -z "$AUVYX_SIGNING_KEYSTORE_BASE64" ] || [ -z "$AUVYX_SIGNING_STORE_PASSWORD" ] ||
               [ -z "$AUVYX_SIGNING_KEY_ALIAS" ] || [ -z "$AUVYX_SIGNING_KEY_PASSWORD" ]; then
              echo "::error::Configure all four AUVYX signing secrets together."
              exit 1
            fi
            umask 077
            printf '%s' "$AUVYX_SIGNING_KEYSTORE_BASE64" | base64 --decode > app/auvyx-signing.jks
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No stable signing keystore supplied; using the runner debug key."
          fi

      - name: Build debug APK
        env:
          AUVYX_SIGNING_STORE_PASSWORD: ${{ secrets.AUVYX_SIGNING_STORE_PASSWORD }}
          AUVYX_SIGNING_KEY_ALIAS: ${{ secrets.AUVYX_SIGNING_KEY_ALIAS }}
          AUVYX_SIGNING_KEY_PASSWORD: ${{ secrets.AUVYX_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Check resolved Material 3 dependencies
        run: gradle --no-daemon :app:dependencyInsight --configuration debugRuntimeClasspath --dependency androidx.compose.material3:material3

      - name: Verify launcher resources in APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^package: name='com\.nexus\.music' versionCode='[0-9]+' versionName='Alpha 2\.1'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          "$aapt2" dump resources "$apk" > "$RUNNER_TEMP/auvyx-resources.txt"
          for resource in drawable/auvyx_default_icon drawable/auvyx_neon_icon drawable/auvyx_glass_icon mipmap/ic_launcher mipmap/ic_launcher_round mipmap/auvyx_icon_1 mipmap/auvyx_icon_2 mipmap/auvyx_icon_3; do
            grep -F " $resource" "$RUNNER_TEMP/auvyx-resources.txt"
          done

      - name: Verify wallpaper assets in APK
        run: |
          python3 - <<'PYTHON'
          from collections import Counter
          from zipfile import ZipFile

          with ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              groups = Counter(
                  name.split("/")[2] for name in apk.namelist()
                  if name.startswith("assets/wallpapers/") and name.lower().endswith((".jpg", ".jpeg"))
              )
          expected = {"auvyx default": 6, "ice blue": 3, "emerald night": 3, "sunset glow": 8,
                      "rose pulse": 4, "crimson wave": 3, "silver mist": 3, "ocean deep": 3, "forest haze": 3}
          assert groups == expected, groups
          print("Verified 36 original backgrounds across 9 accent themes")
          PYTHON

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.signing.outputs.ready == 'true' && 'auvyx-Alpha-2.1-debug' || 'auvyx-Alpha-2.1-debug-fresh-install-only' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK for direct download
        if: github.event_name == 'workflow_dispatch' && inputs.publish_apk
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_SIGNING: ${{ steps.signing.outputs.ready }}
        run: |
          tag="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          filename="auvyx-${GITHUB_SHA::7}.apk"
          if [ "$STABLE_SIGNING" != true ]; then
            filename="auvyx-${GITHUB_SHA::7}-fresh-install-only.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$filename"
          cd "$RUNNER_TEMP"
          sha256sum "$filename" > "$filename.sha256"
          gh release create "$tag" "$filename" "$filename.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "auvyx test APK ${GITHUB_SHA::7}" \
            --notes "Download the APK directly. Updating an existing installation requires a matching signing certificate."

      - name: Build APK with permanent release key
        if: steps.signing.outputs.ready == 'true'
        env:
          AUVYX_SIGNING_STORE_PASSWORD: ${{ secrets.AUVYX_SIGNING_STORE_PASSWORD }}
          AUVYX_SIGNING_KEY_ALIAS: ${{ secrets.AUVYX_SIGNING_KEY_ALIAS }}
          AUVYX_SIGNING_KEY_PASSWORD: ${{ secrets.AUVYX_SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "^package: name='com\.nexus\.music' versionCode='[0-9]+' versionName='Alpha 2\.1'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: auvyx-Alpha-2.1-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auvyx-Alpha-2.1-unit-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Check live SoundCloud and LRCLIB endpoints
        continue-on-error: true
        env:
          AUVYX_LIVE_SC: '1'
          AUVYX_LIVE_LYRICS: '1'
        run: gradle --no-daemon testDebugUnitTest --tests '*.SoundCloudLiveTest' --tests '*.LyricsLiveTest'

      - name: Report signing mode
        if: always()
        run: |
          if [ -f app/auvyx-signing.jks ]; then
            echo "Stable signing keystore was supplied to this build."
          else
            echo "::warning::This APK uses this runner's temporary debug key and is for fresh installs only."
            echo "The debug APK is for fresh installs only. To produce an update, supply the keystore used by the installed APK through the AUVYX signing secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

  glass-emulator:
    if: github.ref == 'refs/heads/alpha-2.1-glass-ui'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: auvyx-Alpha-2.1-debug*
          merge-multiple: true
          path: apk
      - uses: android-actions/setup-android@v4
      - name: Boot an accelerated Android 15 emulator
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n glass -k "system-images;android-35;google_apis;x86_64" --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd glass -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emu.log" 2>&1 &
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          adb install apk/app-debug.apk
      - name: Verify Glass UI and capture device screenshots
        run: python3 .github/scripts/glass-emulator.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: auvyx-glass-emulator
          path: glass-screens/
